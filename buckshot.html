// ---------------- Sound ----------------
let audioCtx = null, muted = false;
function audio(){
  if(muted) return null;
  try{
    if(!audioCtx){ const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return null; audioCtx = new AC(); }
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }catch(e){ return null; }
}
function tone(freq, dur, {type='sine', gain=.12, delay=0, sweepTo=null}={}){
  const ctx = audio(); if(!ctx) return;
  const t0 = ctx.currentTime + delay;
  const osc = ctx.createOscillator(), g = ctx.createGain();
  osc.type = type; osc.frequency.setValueAtTime(freq, t0);
  if(sweepTo) osc.frequency.exponentialRampToValueAtTime(sweepTo, t0+dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(gain, t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  osc.connect(g).connect(ctx.destination); osc.start(t0); osc.stop(t0+dur+0.02);
}
function noiseBurst(dur, gain, delay=0, freq=1800){
  const ctx = audio(); if(!ctx) return;
  const frames = Math.floor(ctx.sampleRate * dur);
  const buf = ctx.createBuffer(1, frames, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<frames;i++) data[i] = (Math.random()*2-1) * (1 - i/frames);
  const src = ctx.createBufferSource(); src.buffer = buf;
  const g = ctx.createGain(); g.gain.value = gain;
  const filt = ctx.createBiquadFilter(); filt.type = 'bandpass'; filt.frequency.value = freq;
  src.connect(filt).connect(g).connect(ctx.destination);
  src.start(ctx.currentTime + delay);
}

  empty(){ tone(700, .04, {type:'square', gain:.07}); tone(300,.06,{type:'square',gain:.05,delay:.04}); },

  reload(){ for(let i=0;i<4;i++) tone(220+i*40, .06, {type:'square', gain:.06, delay:i*.09}); },

let playerHp = 4, aiHp = 4;
let shells = [];        // queue of 'live'/'blank', index0 = next to fire
let liveLeft = 0, blankLeft = 0;
let items = { player:{mag:0,knife:0,smoke:0,drink:0}, ai:{mag:0,knife:0,smoke:0,drink:0} };
let knifeArmed = { player:false, ai:false };
let peekedNext = null;   // shell type revealed to the player by the magnifier, cleared once consumed/changed
let turn = 'player';
let round = 1;
let busy = false;        // true while an animation/AI turn is resolving, blocks input
let gameOver = false;
let wins = 0, losses = 0;

const ITEM_KEYS = ['mag','knife','smoke','drink'];
const ITEM_EMOJI = {mag:'🔍', knife:'🔪', smoke:'🚬', drink:'🥤'};
const ITEM_LABELKEY = {mag:'itemMag', knife:'itemKnife', smoke:'itemSmoke', drink:'itemDrink'};

function rnd(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }

function newShellSet(){
  const live = rnd(2,4);
  const blank = rnd(2,4);
  const arr = [];
  for(let i=0;i<live;i++) arr.push('live');
  for(let i=0;i<blank;i++) arr.push('blank');
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return {arr, live, blank};
}

function grantItems(side){
  const pool = ITEM_KEYS.slice();
  const count = rnd(1,2);
  for(let i=0;i<count;i++){
    const k = pool[Math.floor(Math.random()*pool.length)];
    items[side][k] = Math.min(3, (items[side][k]||0) + 1);
  }
}

function reload(){
  const {arr, live, blank} = newShellSet();
  shells = arr; liveLeft = live; blankLeft = blank;
  knifeArmed.player = false; knifeArmed.ai = false;
  peekedNext = null;
  grantItems('player'); grantItems('ai');
  sfx.reload();
  log('sys', t('msgReload', live, blank));
  renderAll();
}

function log(cls, text){
  const list = document.getElementById('logList');
  const d = document.createElement('div');
  d.className = 'log-line ' + cls;
  d.textContent = text;
  list.insertBefore(d, list.firstChild);
  while(list.children.length > 60) list.removeChild(list.lastChild);
}

function setMessage(text){ document.getElementById('message').textContent = text; }

// ---------------- Rendering ----------------
function renderHearts(el, hp){
  el.innerHTML = '';
  for(let i=0;i<maxHp;i++){
    const s = document.createElement('span');
    s.className = 'heart' + (i < hp ? '' : ' empty');
    s.textContent = '❤️';
    el.appendChild(s);
  }
}

function renderAll(){
  renderHearts(document.getElementById('playerHearts'), playerHp);
  renderHearts(document.getElementById('aiHearts'), aiHp);
  document.getElementById('playerFighter').classList.toggle('active', turn==='player' && !gameOver);
  document.getElementById('aiFighter').classList.toggle('active', turn==='ai' && !gameOver);
  document.getElementById('roundNum').textContent = round;
  document.getElementById('record').textContent = t('recordFmt', wins, losses);

  document.getElementById('shellCounts').innerHTML = t('shellCountsFmt', liveLeft, blankLeft);
  const row = document.getElementById('shellsRow');
  row.innerHTML = '';
  const total = liveLeft + blankLeft;
  for(let i=0;i<total;i++){
    const d = document.createElement('div');
    d.className = 'shell';
    row.appendChild(d);
  }

  const banner = document.getElementById('peekBanner');
  banner.innerHTML = peekedNext
    ? `<div class="peek-banner">🔍 ${t(peekedNext==='live' ? 'liveShell' : 'blankShell')}</div>`
    : '';

  renderItems();

  const myTurn = turn === 'player' && !gameOver && !busy;
  document.getElementById('shootOppoBtn').disabled = !myTurn;
  document.getElementById('shootSelfBtn').disabled = !myTurn;
  document.getElementById('shootOppoBtn').textContent = t('shootOppo');
  document.getElementById('shootSelfBtn').textContent = t('shootSelf');
  document.getElementById('restartBtn').style.display = gameOver ? 'inline-block' : 'none';
}

function renderItems(){
  const box = document.getElementById('playerItems');
  box.innerHTML = '';
  const myTurn = turn === 'player' && !gameOver && !busy;
  ITEM_KEYS.forEach(k=>{
    const n = items.player[k] || 0;
    const btn = document.createElement('button');
    btn.className = 'item-btn';
    btn.disabled = !myTurn || n<=0;
    btn.innerHTML = `${ITEM_EMOJI[k]}<span class="lbl">${t(ITEM_LABELKEY[k])}</span><span class="count">×${n}</span>`;
    btn.addEventListener('click', ()=> useItem('player', k));
    box.appendChild(btn);
  });
}

function flashAvatar(side){
  const el = document.getElementById(side==='player' ? 'playerAvatar' : 'aiAvatar');
  el.classList.remove('hit'); void el.offsetWidth; el.classList.add('hit');
}

function animateGun(aim, cb){
  const gun = document.getElementById('gunEl');
  const flash = document.getElementById('muzzleFlash');
  gun.className = 'gun ' + (aim==='self' ? 'aim-self' : 'aim-oppo');
  void gun.offsetWidth;
  gun.classList.add('fire');
  flash.classList.remove('show'); void flash.offsetWidth; flash.classList.add('show');
  setTimeout(()=>{ gun.classList.remove('fire'); if(cb) cb(); }, 300);
}

// ---------------- Items ----------------
function useItem(side, key){
  if(gameOver || busy) return;
  if(!items[side][key]){ if(side==='player') setMessage(t('noItem')); return; }
  items[side][key]--;
  sfx.item();
  if(key === 'mag'){
    peekedNext = shells[0] || null;
    log(side==='player'?'you':'ai', side==='player' ? t('itemUseMag', t(peekedNext==='live'?'liveShell':'blankShell')) : t('itemUseMagAi'));
  } else if(key === 'knife'){
    knifeArmed[side] = true;
    log(side==='player'?'you':'ai', side==='player' ? t('itemUseKnife') : t('itemUseKnifeAi'));
  } else if(key === 'smoke'){
    const hp = side==='player' ? playerHp : aiHp;
    if(hp < maxHp){
      if(side==='player') playerHp = Math.min(maxHp, playerHp+1); else aiHp = Math.min(maxHp, aiHp+1);
      sfx.heal();
      log(side==='player'?'you':'ai', side==='player' ? t('itemUseSmoke') : t('itemUseSmokeAi'));
    } else {
      log(side==='player'?'you':'ai', side==='player' ? t('itemUseSmokeFull') : t('itemUseSmokeAiFull'));
    }
  } else if(key === 'drink'){
    const ejected = shells.shift();
    if(ejected === 'live') liveLeft--; else if(ejected === 'blank') blankLeft--;
    peekedNext = null;
    const shellLabel = t(ejected==='live' ? 'liveShell' : 'blankShell');
    log(side==='player'?'you':'ai', side==='player' ? t('itemUseDrink', shellLabel) : t('itemUseDrinkAi', shellLabel));
    if(shells.length === 0){ renderAll(); setTimeout(()=>{ if(!gameOver){ round++; reload(); if(turn==='ai') setTimeout(aiTurn, 500); } }, 400); return; }
  }
  renderAll();
}

// ---------------- Core turn resolution ----------------
function fireAt(target, shooter){
  if(shells.length === 0){ reload(); }
  const shell = shells.shift();
  if(shell === 'live') liveLeft--; else blankLeft--;
  peekedNext = shells.length ? peekedNext : null;
  if(shells.length === 0) peekedNext = null; else if(peekedNext !== null){ /* peeked value applied to the shell that just fired; clear */ peekedNext = null; }

  const dmgBase = 1;
  const dmg = knifeArmed[shooter] ? dmgBase*2 : dmgBase;
  knifeArmed[shooter] = false;

  animateGun(target === shooter ? 'self' : 'oppo', ()=>{
    if(shell === 'live'){
      sfx.blast();
      flashAvatar(target);
      if(target === 'player') playerHp = Math.max(0, playerHp - dmg); else aiHp = Math.max(0, aiHp - dmg);
    } else {
      sfx.empty();
    }
    afterShot(shooter, target, shell, dmg);
  });
}

function afterShot(shooter, target, shell, dmg){
  const cls = shooter === 'player' ? 'you' : 'ai';
  if(shooter === target){
    if(shell === 'live'){
      log(cls, shooter==='player' ? t('msgYouShootSelfLive', dmg) : t('msgAiShootSelfLive', dmg));
      if(shooter==='player') setMessage(t('msgYouShootSelfLive', dmg)); else setMessage(t('msgAiShootSelfLive', dmg));
      turn = shooter === 'player' ? 'ai' : 'player';
    } else {
      log(cls, shooter==='player' ? t('msgYouShootSelfBlank') : t('msgAiShootSelfBlank'));
      setMessage(shooter==='player' ? t('msgYouShootSelfBlank') : t('msgAiShootSelfBlank'));
      // same shooter goes again
    }
  } else {
    if(shell === 'live'){
      log(cls, shooter==='player' ? t('msgYouShootOppoLive', dmg) : t('msgAiShootOppoLive', dmg));
      setMessage(shooter==='player' ? t('msgYouShootOppoLive', dmg) : t('msgAiShootOppoLive', dmg));
    } else {
      log(cls, shooter==='player' ? t('msgYouShootOppoBlank') : t('msgAiShootOppoBlank'));
      setMessage(shooter==='player' ? t('msgYouShootOppoBlank') : t('msgAiShootOppoBlank'));
    }
    turn = shooter === 'player' ? 'ai' : 'player';
  }

  checkGameOver();
  if(gameOver){ busy = false; renderAll(); return; }

  if(shells.length === 0){
    setTimeout(()=>{ round++; reload(); busy = false; renderAll(); if(turn==='ai') setTimeout(aiTurn, 600); }, 500);
    return;
  }

  busy = false;
  renderAll();
  if(turn === 'ai') setTimeout(aiTurn, 700);
}

function checkGameOver(){
  if(playerHp <= 0 || aiHp <= 0){
    gameOver = true;
    if(aiHp <= 0 && playerHp > 0){
      wins++; sfx.win(); setMessage(t('msgWin')); log('sys', t('msgWin'));
    } else if(playerHp <= 0){
      losses++; sfx.lose(); setMessage(t('msgLose')); log('sys', t('msgLose'));
    }
    saveState();
  }
}

function playerShoot(target){
  if(turn !== 'player' || gameOver || busy) return;
  busy = true;
  renderAll();
  fireAt(target, 'player');
}

document.getElementById('shootOppoBtn').addEventListener('click', ()=> playerShoot('ai'));
document.getElementById('shootSelfBtn').addEventListener('click', ()=> playerShoot('player'));

// ---------------- AI ----------------
function aiTurn(){
  if(gameOver || turn !== 'ai') return;
  busy = true;
  renderAll();

  // Simple heuristic: use items first, then decide a target.
  const total = liveLeft + blankLeft;
  const liveRatio = total > 0 ? liveLeft / total : 0.5;

  // Use magnifier if unknown and it might change the decision.
  if(peekedNext === null && items.ai.mag > 0 && Math.random() < 0.7){
    useItem('ai', 'mag');
  }
  // Heal if hurt and safe-ish.
  if(aiHp < maxHp && items.ai.smoke > 0 && (aiHp <= 1 || Math.random() < 0.35)){
    useItem('ai', 'smoke');
  }

  const knownNext = peekedNext; // 'live' | 'blank' | null

  // Decide target.
  let target;
  if(knownNext === 'blank'){
    target = 'ai'; // free extra turn
  } else if(knownNext === 'live'){
    target = 'player';
    if(items.ai.knife > 0 && knifeArmed.ai === false && Math.random() < 0.8) useItem('ai', 'knife');
  } else {
    // Use drink to dodge when odds are bad and AI is low on HP.
    if(liveRatio >= 0.66 && aiHp <= 1 && items.ai.drink > 0){
      useItem('ai', 'drink');
      busy = false;
      setTimeout(aiTurn, 500);
      return;
    }
    target = liveRatio <= 0.45 ? 'ai' : 'player';
    if(target === 'player' && liveRatio >= 0.6 && items.ai.knife > 0 && Math.random() < 0.5) useItem('ai', 'knife');
  }

  setTimeout(()=> fireAt(target, 'ai'), 500);
}

// ---------------- Persistence ----------------
const STORE_KEY = 'devil-roulette-v1';
function saveState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify({lang, muted, wins, losses})); }catch(e){}
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return;
    const s = JSON.parse(raw);
    if(s.lang==='zh'||s.lang==='en') lang = s.lang;
    if(typeof s.muted==='boolean') muted = s.muted;
    if(typeof s.wins==='number') wins = s.wins;
    if(typeof s.losses==='number') losses = s.losses;
  }catch(e){}
}

// ---------------- New match / restart ----------------
function startMatch(){
  maxHp = MAX_HP_OPTIONS[Math.floor(Math.random()*MAX_HP_OPTIONS.length)];
  playerHp = maxHp; aiHp = maxHp;
  items = { player:{mag:0,knife:0,smoke:0,drink:0}, ai:{mag:0,knife:0,smoke:0,drink:0} };
  knifeArmed = { player:false, ai:false };
  peekedNext = null;
  turn = 'player';
  round = 1;
  busy = false;
  gameOver = false;
  document.getElementById('logList').innerHTML = '';
  reload();
  setMessage(t('msgWelcome'));
  log('sys', t('msgWelcome'));
}

document.getElementById('restartBtn').addEventListener('click', startMatch);

// ---------------- Language / mute ----------------
function applyLang(){
  document.documentElement.lang = (lang==='zh') ? 'zh-Hant' : 'en';
  document.querySelectorAll('[data-i18n]').forEach(elm=>{ elm.textContent = t(elm.dataset.i18n); });
  document.getElementById('langBtn').textContent = t('langBtn');
  renderAll();
}
document.getElementById('langBtn').addEventListener('click', ()=>{
  lang = (lang==='zh') ? 'en' : 'zh';
  applyLang();
  saveState();
});

const muteBtn = document.getElementById('muteBtn');
function renderMuteBtn(){
  muteBtn.textContent = muted ? '🔇' : '🔊';
  muteBtn.setAttribute('aria-pressed', String(muted));
}
muteBtn.addEventListener('click', ()=>{
  muted = !muted;
  renderMuteBtn();
  if(!muted) sfx.item();
  saveState();
});

// ---------------- Startup ----------------
loadState();
renderMuteBtn();
applyLang();
startMatch();
</script>
